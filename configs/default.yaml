model:
  name: Qwen/Qwen2.5-3B-Instruct
  fallback_name: Qwen/Qwen2.5-1.5B-Instruct
  max_seq_length: 1024

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  dataset: coastalcph/lex_glue
  subset: ledgar
  train_sample_cap: 12000
  min_chars: 80
  max_chars: 4000
  prefix_fraction: 0.4
  seed: 42

train:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  gradient_checkpointing: true
  bf16: true
  assistant_only_loss: true
  output_dir: outputs/adapter

paths:
  train_jsonl: data/processed/train.jsonl
  val_jsonl: data/processed/val.jsonl
  test_jsonl: data/processed/test.jsonl
